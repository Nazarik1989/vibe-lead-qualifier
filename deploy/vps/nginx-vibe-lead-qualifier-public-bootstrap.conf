limit_req_zone $binary_remote_addr zone=vibe_vps_public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=vibe_vps_webhook:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=vibe_vps_demo:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=vibe_vps_connections:10m;

log_format vibe_vps_min '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name vibe-lead-qualifier.88-218-169-93.sslip.io;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 10s;

    access_log /var/log/nginx/vibe-lead-qualifier-public.access.log vibe_vps_min;
    error_log /var/log/nginx/vibe-lead-qualifier-public.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vibe-lead-qualifier-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
