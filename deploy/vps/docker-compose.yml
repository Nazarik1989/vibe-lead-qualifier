version: "3.8"

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    image: vibe-lead-qualifier:local
    container_name: vibe-lead-qualifier-app
    env_file:
      - ../../.env
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ../../data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
