limit_req_zone $binary_remote_addr zone=vibe_vps_public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=vibe_vps_webhook:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=vibe_vps_demo:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=vibe_vps_connections:10m;

log_format vibe_vps_min '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name vibe-lead-qualifier.88-218-169-93.sslip.io;
    server_tokens off;

    client_max_body_size 1m;
    client_body_timeout 10s;

    access_log /var/log/nginx/vibe-lead-qualifier-public.access.log vibe_vps_min;
    error_log /var/log/nginx/vibe-lead-qualifier-public.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vibe-lead-qualifier-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://vibe-lead-qualifier.88-218-169-93.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vibe-lead-qualifier.88-218-169-93.sslip.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/vibe-lead-qualifier.88-218-169-93.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibe-lead-qualifier.88-218-169-93.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:VIBE_VPS_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    client_body_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 17s;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn vibe_vps_connections 20;

    access_log /var/log/nginx/vibe-lead-qualifier-public.access.log vibe_vps_min;
    error_log /var/log/nginx/vibe-lead-qualifier-public.error.log warn;

    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_send_timeout 15s;
    proxy_read_timeout 17s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_set_header Connection "";

    location = /health {
        limit_req zone=vibe_vps_public burst=20 nodelay;
        proxy_pass http://127.0.0.1:18000;
    }

    location = /webhooks/vibe {
        limit_req zone=vibe_vps_webhook burst=20 nodelay;
        proxy_pass http://127.0.0.1:18000;
    }

    location = /docs {
        auth_basic "Vibe Lead Qualifier demo";
        auth_basic_user_file /etc/nginx/vibe-lead-qualifier.htpasswd;
        limit_req zone=vibe_vps_demo burst=10 nodelay;
        proxy_pass http://127.0.0.1:18000;
    }

    location ^~ /docs/ {
        auth_basic "Vibe Lead Qualifier demo";
        auth_basic_user_file /etc/nginx/vibe-lead-qualifier.htpasswd;
        limit_req zone=vibe_vps_demo burst=10 nodelay;
        proxy_pass http://127.0.0.1:18000;
    }

    location = /openapi.json {
        auth_basic "Vibe Lead Qualifier demo";
        auth_basic_user_file /etc/nginx/vibe-lead-qualifier.htpasswd;
        limit_req zone=vibe_vps_demo burst=10 nodelay;
        proxy_pass http://127.0.0.1:18000;
    }

    location = /demo {
        auth_basic "Vibe Lead Qualifier demo";
        auth_basic_user_file /etc/nginx/vibe-lead-qualifier.htpasswd;
        limit_req zone=vibe_vps_demo burst=10 nodelay;
        proxy_pass http://127.0.0.1:18000;
    }

    location ^~ /demo/ {
        auth_basic "Vibe Lead Qualifier demo";
        auth_basic_user_file /etc/nginx/vibe-lead-qualifier.htpasswd;
        limit_req zone=vibe_vps_demo burst=10 nodelay;
        proxy_pass http://127.0.0.1:18000;
    }

    location / {
        return 404;
    }
}
